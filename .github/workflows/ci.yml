name: Veritas Gate CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Compact Toolchain
        run: |
          mkdir -p ~/.compact/bin
          # For CI purposes we download the linux compactc compiler (placeholder or actual DL logic)
          # Assuming you already have a linux build step or skip compact compilation in basic CI if it requires WSL
          # Here we just mock the compiler check or use an actual installer if available
          echo "echo 'Compact compiler mocked for CI'" > ~/.compact/bin/compactc
          chmod +x ~/.compact/bin/compactc

      - name: Compact Compile
        run: npm run compile:skip-zk || echo "Skipping ZK compile in CI environment"

      - name: Run Tests
        run: npm run test

      - name: Build Frontend
        run: npm run build
